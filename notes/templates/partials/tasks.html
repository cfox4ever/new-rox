<div class="tab-pane fade show active" id="all-tasks" role="tabpanel" aria-labelledby="all-tasks-tab">
  {% for task in tasks %}
  <div class="card mb-3 {% if task.due_date < today %}bg-danger text-white{% endif %}">
    <div class="card-body">
      <h5 class="card-title">
        <i class="fa fa-tasks"></i> {{ task.name }}
      </h5>
      <p class="card-text">{{ task.details }}</p>
      <p class="card-text">
        <small class="text-muted">
          <i class="fa fa-calendar-alt"></i> {{ task.due_date|date:"Y-m-d" }}
        </small>
      </p>
      {% if task.is_done %}
      <button class="btn btn-warning" hx-post="{% url 'task_completed' task.id %}" hx-target="#all-tasks">
        <i class="fa fa-undo"></i> Mark as Not Completed
      </button>
      {% else %}
      <button class="btn btn-success" hx-post="{% url 'task_completed' task.id %}" hx-target="#all-tasks">
        <i class="fa fa-check"></i> Mark as Completed
      </button>
      {% endif %}
    </div>
  </div>
  {% endfor %}
</div>
